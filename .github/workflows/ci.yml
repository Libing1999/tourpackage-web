name: Web CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      # --frozen-lockfile: CI must fail on a lockfile that disagrees with
      # package.json rather than quietly resolving different versions than a
      # developer got.
      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build
        env:
          # Build-time public values. The real deployment supplies its own; these
          # only need to be well-formed for the build to complete.
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tourpackage-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080/api
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
